# Гейты проекта.
#
# ЗАЧЕМ. До 14.08.2026 CI не было вообще. Проверки существовали
# отдельными скриптами, и запускать их надо было помнить. 13.08 в `main`
# слились #30 и #31 при КРАСНОМ `check-i18n-keys` — в результате у
# каждого вошедшего пользователя в навбаре висела служебная фраза
# i18next вместо трёх пунктов меню. Нашлось это не гейтом, а замером
# живого прода на следующий день.
#
# Правило, ради которого этот файл существует: проверка, которую надо не
# забыть запустить, однажды не запускается.

name: Гейты

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: минуты бесплатного
# тарифа тратить на устаревшие коммиты незачем.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        # Браузеры Playwright не тянем: его сценарии в CI не идут (см.
        # ниже), а установка браузеров — это сотни мегабайт и минуты на
        # каждом прогоне.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # Сторожа идут ОТДЕЛЬНЫМИ шагами, хотя каждый обёрнут ещё и в
      # тест. Это не дублирование по недосмотру:
      #   • падение видно по имени шага, а не как «один из 124 тестов»;
      #   • они дешёвые (секунды) и валят прогон до сорокасекундного
      #     vitest;
      #   • если кто-то однажды выкинет шаг из этого файла, обёртка в
      #     тестах всё равно поймает — два независимых пути к одной
      #     проверке.
      - name: Страж утверждений
        run: node scripts/check-claims.mjs

      - name: Словари (t() есть во всех трёх языках)
        run: node scripts/check-i18n-keys.mjs

      - name: Текст мимо словарей (храповик)
        run: node scripts/check-hardcoded-text.mjs

      - name: Занятость считается в одном месте
        run: node scripts/check-availability-single-source.mjs

      - name: Прямой доступ к базе (храповик)
        run: node scripts/check-db-access.mjs

      # Итоговые привилегии anon/authenticated после проигрывания всех
      # миграций по порядку. Ловит класс «одна строка GRANT разворачивает
      # три прежние миграции» — см. шапку скрипта.
      - name: Привилегии клиентских ролей
        run: node scripts/check-migration-grants.mjs

      # Снятая 12.08 палитра: лайм и старый чёрный. Инлайн-стили и
      # шаблонные строки замена переменных не достаёт — два места прожили
      # так пять недель, одно из них на первом экране посетителя.
      - name: Снятая палитра (храповик)
        run: node scripts/check-retired-palette.mjs

      # Цветные эмодзи мимо CategoryIcon/StateIcon. Граница — свойство
      # Unicode Emoji_Presentation: ⚡🔧📍 да, ✓✦→ нет.
      - name: Эмодзи в интерфейсе (храповик)
        run: node scripts/check-emoji-in-ui.mjs

      # Отдельно от vitest НАМЕРЕННО: vitest не зовёт tsc. Ровно на этом
      # уже обжигались — локальный прогон тестов был зелёным, а сборка на
      # Vercel возвращала 2 на implicit any в тестовом файле.
      # Мёртвый груз в public/: Vite копирует папку целиком, не
      # спрашивая, нужен ли файл. 921 КБ уезжали в каждую сборку с
      # августа, и ни одна проверка этого не видела.
      - name: Мёртвый груз в public
        run: node scripts/check-unused-public.mjs

      - name: Типы
        run: npx tsc --noEmit

      # СБОРКА ИДЁТ ПЕРЕД ТЕСТАМИ, и это не вкус.
      #
      # Часть проверок смотрит на РЕЗУЛЬТАТ сборки: service worker
      # собирается из шаблона, и список предзагрузки в нём появляется
      # только здесь. Пока сборка шла после, эти проверки в CI молча
      # пропускались — `dist/` ещё не существовало, — и джоб был зелёным,
      # ни разу на них не взглянув.
      #
      # Сторож со слепой зоной опаснее отсутствующего: он выдаёт
      # разрешение, которого не проверял.
      - name: Сборка
        run: npm run build

      - name: Юнит-тесты
        run: npx vitest run

      # Чего здесь НЕТ и почему:
      #
      # • Playwright — сценарии нацелены на ЖИВОЙ прод через E2E_BASE_URL
      #   и создают там учётки и объявления. Витрина пуста намеренно;
      #   мусор на ней — не «мелочь в тестовой базе», а неверная витрина
      #   (11.08 шесть тестовых вещей доехали до живой). Прогонять руками
      #   с уборкой после.
      # • npm run test:edge — бьёт по РАЗВЁРНУТЫМ функциям живого проекта
      #   Supabase и требует ключей. В CI это значит либо секреты боевой
      #   базы в публичном репозитории, либо мутации прода на каждый PR.
      #   Ни то ни другое.

  # ──────────────────────────────────────────────────────────────────────
  # Прогон браузером. ПОСЛЕ мержа в main, не на PR.
  #
  # ЗАЧЕМ. 19.08 замерено: набор Playwright не запускали с 12.08, и за это
  # время продукт ушёл вперёд на три PR. Из 55 проверок семь падали на
  # устаревших подписях, а помощник `ensureProfilePhoto` искал поле,
  # исчезнувшее 13.08, чем ронял ВСЁ, что заводит вещь, — включая «цикл
  # аренды», единственную проверку, чей провал означает, что продукт не
  # делает обещанного. Шесть дней этого никто не видел, потому что
  # браузерный прогон не входил ни в хук перед push, ни сюда.
  #
  # ПОЧЕМУ НЕ НА PR. Сценарии бьют по РАЗВЁРНУТОМУ адресу. На PR это было
  # бы preview-развёртывание, чей адрес надо ещё вытащить из Vercel и
  # передать заданию. После мержа адрес известен и постоянен — это прод.
  # Цена решения названа честно: сломанное успевает попасть в main, и
  # прогон сообщает об этом через минуту после, а не до.
  #
  # ПОЧЕМУ БЕЗ ТРАСС И БЕЗ ВЫГРУЗКИ АРТЕФАКТОВ. Репозиторий ПУБЛИЧНЫЙ, а
  # артефакты Actions в публичном репозитории скачивает кто угодно. Трасса
  # Playwright содержит снимки страницы входа вместе с введённым паролем
  # тестовой учётки. Разбирать падение по журналу — небольшая цена за то,
  # чтобы не публиковать доступ.
  browser:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Сценарии создают и удаляют НАСТОЯЩИЕ строки в единственной базе
    # проекта. Два прогона одновременно затопчут друг друга, поэтому
    # очередь, а не отмена: отменённый прогон оставил бы за собой мусор.
    concurrency:
      group: e2e-prod
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Браузер
        run: npx playwright install --with-deps chromium

      # Прод разворачивается асинхронно: без ожидания прогон проверял бы
      # ПРЕДЫДУЩУЮ сборку и валился на изменениях, которые только что въехали.
      - name: Дождаться прод-развёртывания этого коммита
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&environment=Production" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state // empty')
              echo "развёртывание $id: ${state:-нет статуса}"
              [ "$state" = "success" ] && exit 0
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::прод не развернулся — проверять нечего"
                exit 1
              fi
            else
              echo "развёртывания для коммита пока нет"
            fi
            sleep 15
          done
          echo "::error::прод не развернулся за 10 минут"
          exit 1

      # Без учёток каждый сценарий сам себя ПРОПУСКАЕТ (test.skip в файлах),
      # и прогон зеленеет, не проверив ничего. Зелёный гейт, который не мог
      # увидеть работу, хуже отсутствующего: на него полагаются.
      - name: Учётки на месте
        env:
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
          TEST_RENTER_EMAIL: ${{ secrets.TEST_RENTER_EMAIL }}
          TEST_RENTER_PASSWORD: ${{ secrets.TEST_RENTER_PASSWORD }}
        run: |
          missing=""
          if [ -z "$TEST_OWNER_EMAIL" ];    then missing="$missing TEST_OWNER_EMAIL"; fi
          if [ -z "$TEST_OWNER_PASSWORD" ]; then missing="$missing TEST_OWNER_PASSWORD"; fi
          if [ -z "$TEST_RENTER_EMAIL" ];   then missing="$missing TEST_RENTER_EMAIL"; fi
          if [ -z "$TEST_RENTER_PASSWORD" ];then missing="$missing TEST_RENTER_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::нет секретов:$missing — без них сценарии пропускаются, и прогон позеленел бы вхолостую"
            exit 1
          fi
          echo "учётки заданы"

      - name: Сценарии
        env:
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
          TEST_RENTER_EMAIL: ${{ secrets.TEST_RENTER_EMAIL }}
          TEST_RENTER_PASSWORD: ${{ secrets.TEST_RENTER_PASSWORD }}
        # --trace=off и --reporter=line: см. про публичный репозиторий выше.
        run: npx playwright test --trace=off --reporter=line

      # Уборка на случай, если прогон оборвался посередине и оставил вещь.
      # Витрину держат пустой намеренно — мусор, о котором никто не узнаёт,
      # копится всегда.
      #
      # 🔴 ЭТОТ ШАГ НЕ УДАЛЯЛ НИЧЕГО. До 19.09.2026 он звал скрипт БЕЗ
      # `--apply`, то есть в режиме показа: печатал «Это список, а не
      # удаление. Повторите с --apply», выходил с нулём и выглядел
      # отработавшим. Плюс `|| true` глушил и настоящие отказы.
      #
      # Цена замерена в тот же день: единственным объявлением на живой
      # витрине оказалась вещь «E2E безкоординат», оставленная оборвавшимся
      # прогоном. Весь публичный шоурум продукта — мусор оснастки.
      #
      # Шаг УРОНИТ прогон, если уборка не отработала. Это сознательно:
      # тесты своё уже сказали предыдущим шагом, а мусор на витрине —
      # такой же отказ продукта, как красный тест, только молчаливый. Гейт,
      # который знает о своей слепой зоне и не падает, — не гейт.
      - name: Убрать остатки прогона
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: |
          if ! node scripts/cleanup-e2e-items.mjs --apply; then
            echo "::error::уборка не отработала — объявления могли остаться на живой витрине. Добить: node scripts/cleanup-e2e-items.mjs --apply"
            exit 1
          fi
