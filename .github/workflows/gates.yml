# Гейты проекта.
#
# ЗАЧЕМ. До 14.08.2026 CI не было вообще. Проверки существовали
# отдельными скриптами, и запускать их надо было помнить. 13.08 в `main`
# слились #30 и #31 при КРАСНОМ `check-i18n-keys` — в результате у
# каждого вошедшего пользователя в навбаре висела служебная фраза
# i18next вместо трёх пунктов меню. Нашлось это не гейтом, а замером
# живого прода на следующий день.
#
# Правило, ради которого этот файл существует: проверка, которую надо не
# забыть запустить, однажды не запускается.

name: Гейты

on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: минуты бесплатного
# тарифа тратить на устаревшие коммиты незачем.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# ОБРАЗ И ВЕРСИИ ДЕЙСТВИЙ ЗАКРЕПЛЕНЫ (24.09.2026).
#
# `ubuntu-latest` с 19.10.2026 переезжает на Ubuntu 26 — об этом
# предупреждал каждый прогон. Браузерный джоб ставит системные зависимости
# Playwright под конкретную версию системы, и такой переезд мог бы в один
# день покрасить main без единой правки кода. Образ закреплён на 24.04 —
# том, на котором всё зелёное сегодня; на 26 переходить отдельной правкой.
#
# checkout и setup-node — v5: v4 собраны под Node 20, срок поддержки
# которого истёк, и раннер уже запускал их на Node 24 принудительно.
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Установка зависимостей
        # Браузеры Playwright не тянем: его сценарии в CI не идут (см.
        # ниже), а установка браузеров — это сотни мегабайт и минуты на
        # каждом прогоне.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # Сторожа идут ОТДЕЛЬНЫМИ шагами, хотя каждый обёрнут ещё и в
      # тест. Это не дублирование по недосмотру:
      #   • падение видно по имени шага, а не как «один из 124 тестов»;
      #   • они дешёвые (секунды) и валят прогон до сорокасекундного
      #     vitest;
      #   • если кто-то однажды выкинет шаг из этого файла, обёртка в
      #     тестах всё равно поймает — два независимых пути к одной
      #     проверке.
      - name: Страж утверждений
        run: node scripts/check-claims.mjs

      - name: Словари (t() есть во всех трёх языках)
        run: node scripts/check-i18n-keys.mjs

      - name: Текст мимо словарей (храповик)
        run: node scripts/check-hardcoded-text.mjs

      - name: Занятость считается в одном месте
        run: node scripts/check-availability-single-source.mjs

      - name: Прямой доступ к базе (храповик)
        run: node scripts/check-db-access.mjs

      # Итоговые привилегии anon/authenticated после проигрывания всех
      # миграций по порядку. Ловит класс «одна строка GRANT разворачивает
      # три прежние миграции» — см. шапку скрипта.
      - name: Привилегии клиентских ролей
        run: node scripts/check-migration-grants.mjs

      # Снятая 12.08 палитра: лайм и старый чёрный. Инлайн-стили и
      # шаблонные строки замена переменных не достаёт — два места прожили
      # так пять недель, одно из них на первом экране посетителя.
      - name: Снятая палитра (храповик)
        run: node scripts/check-retired-palette.mjs

      # Цветные эмодзи мимо CategoryIcon/StateIcon. Граница — свойство
      # Unicode Emoji_Presentation: ⚡🔧📍 да, ✓✦→ нет.
      - name: Эмодзи в интерфейсе (храповик)
        run: node scripts/check-emoji-in-ui.mjs

      # Отдельно от vitest НАМЕРЕННО: vitest не зовёт tsc. Ровно на этом
      # уже обжигались — локальный прогон тестов был зелёным, а сборка на
      # Vercel возвращала 2 на implicit any в тестовом файле.
      # Мёртвый груз в public/: Vite копирует папку целиком, не
      # спрашивая, нужен ли файл. 921 КБ уезжали в каждую сборку с
      # августа, и ни одна проверка этого не видела.
      - name: Мёртвый груз в public
        run: node scripts/check-unused-public.mjs

      - name: Типы
        run: npx tsc --noEmit

      # СБОРКА ИДЁТ ПЕРЕД ТЕСТАМИ, и это не вкус.
      #
      # Часть проверок смотрит на РЕЗУЛЬТАТ сборки: service worker
      # собирается из шаблона, и список предзагрузки в нём появляется
      # только здесь. Пока сборка шла после, эти проверки в CI молча
      # пропускались — `dist/` ещё не существовало, — и джоб был зелёным,
      # ни разу на них не взглянув.
      #
      # Сторож со слепой зоной опаснее отсутствующего: он выдаёт
      # разрешение, которого не проверял.
      - name: Сборка
        run: npm run build

      - name: Юнит-тесты
        run: npx vitest run

      # Чего здесь НЕТ и почему:
      #
      # • Playwright — сценарии заводят учётки и объявления в настоящей
      #   базе. Они идут после мержа, на стенде: задание browser ниже.
      # • npm run test:edge — бьёт по РАЗВЁРНУТЫМ функциям проекта Supabase
      #   и требует ключей. На каждый PR это мутации базы и секреты в
      #   публичном репозитории. Гонять руками, на стенде.

  # ──────────────────────────────────────────────────────────────────────
  # Прогон браузером. ПОСЛЕ мержа в main, не на PR.
  #
  # ЗАЧЕМ. 19.08 замерено: набор Playwright не запускали с 12.08, и за это
  # время продукт ушёл вперёд на три PR. Из 55 проверок семь падали на
  # устаревших подписях, а помощник `ensureProfilePhoto` искал поле,
  # исчезнувшее 13.08, чем ронял ВСЁ, что заводит вещь, — включая «цикл
  # аренды», единственную проверку, чей провал означает, что продукт не
  # делает обещанного. Шесть дней этого никто не видел, потому что
  # браузерный прогон не входил ни в хук перед push, ни сюда.
  #
  # ГДЕ — НА СТЕНДЕ rentit-staging, с 03.10.2026. До того прогон шёл по
  # живому проду, и 03.10 шестой за сутки прогон уронил прод на четыре
  # часа. У экземпляра NANO 0,5 ГБ памяти, а сервисам нужно больше:
  # остаток уходит в swap, под нагрузкой swap рос, и к вечеру всё встало
  # (CPU 0 %, swap больше 300 МБ, статус Unhealthy). Заодно прогоны
  # перестали заводить объявления на живой витрине.
  #
  # Сайт для прогона собирается здесь же с ключами стенда и поднимается
  # локально (vite preview). Ждать развёртывания и вытаскивать адрес
  # preview из Vercel не нужно. Код тот же, что уходит в прод; отличаются
  # только адрес базы и ключ. Прод после мержа проверяет задание
  # prod-smoke ниже: только чтение, без входа и без записи.
  #
  # ПОЧЕМУ НЕ НА PR. Стенд один: два прогона одновременно затопчут друг
  # друга. А PR со своей миграцией шёл бы против базы, где её ещё нет.
  # После мержа код main и стенд совпадают: миграции сначала ложатся на
  # стенд, потом на прод. Цена решения названа честно: сломанное успевает
  # попасть в main, и прогон сообщает об этом через минуты после, а не до.
  #
  # ПОЧЕМУ БЕЗ ТРАСС И БЕЗ ВЫГРУЗКИ АРТЕФАКТОВ. Репозиторий ПУБЛИЧНЫЙ, а
  # артефакты Actions в публичном репозитории скачивает кто угодно. Трасса
  # Playwright содержит снимки страницы входа вместе с введённым паролем
  # тестовой учётки. Разбирать падение по журналу — небольшая цена за то,
  # чтобы не публиковать доступ.
  #
  # Секреты — на шагах, а не на задании: `npm ci` и установка браузера
  # исполняют чужие скрипты, и паролям учёток там делать нечего.
  browser:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    # Сценарии создают и удаляют настоящие строки в базе стенда. Два
    # прогона одновременно затопчут друг друга, поэтому очередь, а не
    # отмена: отменённый прогон оставил бы за собой мусор.
    concurrency:
      group: e2e-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Браузер
        run: npx playwright install --with-deps chromium

      # Без учёток каждый сценарий сам себя ПРОПУСКАЕТ (test.skip в файлах),
      # и прогон зеленеет, не проверив ничего. Без адреса стенда сайт
      # собрался бы с пустой базой. Зелёный гейт, который не мог увидеть
      # работу, хуже отсутствующего: на него полагаются.
      - name: Учётки и стенд на месте
        env:
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
          TEST_RENTER_EMAIL: ${{ secrets.TEST_RENTER_EMAIL }}
          TEST_RENTER_PASSWORD: ${{ secrets.TEST_RENTER_PASSWORD }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          for v in TEST_OWNER_EMAIL TEST_OWNER_PASSWORD TEST_RENTER_EMAIL TEST_RENTER_PASSWORD STAGING_SUPABASE_URL STAGING_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::нет секретов:$missing — без них сценарии пропускаются или бьют не туда"
            exit 1
          fi
          echo "учётки и стенд заданы"

      # Только сборка: проверку типов уже прошло задание gates.
      - name: Сайт с ключами стенда
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          npx vite build
          if ! grep -qF "$VITE_SUPABASE_URL" dist/assets/*.js; then
            echo "::error::в сборке нет адреса стенда — прогон проверил бы не ту базу"
            exit 1
          fi

      - name: Поднять сайт локально
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/ > /dev/null; then echo "сайт отвечает"; exit 0; fi
            sleep 1
          done
          echo "::error::vite preview не ответил за 30 секунд"
          cat preview.log
          exit 1

      - name: Сценарии
        env:
          E2E_BASE_URL: http://localhost:4173
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
          TEST_RENTER_EMAIL: ${{ secrets.TEST_RENTER_EMAIL }}
          TEST_RENTER_PASSWORD: ${{ secrets.TEST_RENTER_PASSWORD }}
          # Уборка вещи закрывает её живые брони по API до удаления
          # (tests/helpers/fixtures.ts → scripts/close-live-bookings.mjs).
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        # --trace=off и --reporter=line: см. про публичный репозиторий выше.
        run: npx playwright test --trace=off --reporter=line

      # Уборка на случай, если прогон оборвался посередине и оставил вещь.
      #
      # 🔴 До 19.09.2026 этот шаг НЕ УДАЛЯЛ НИЧЕГО: скрипт звался без
      # `--apply`, печатал список и выходил с нулём, а `|| true` глушил и
      # настоящие отказы. Единственным объявлением на живой витрине тогда
      # оказалась вещь «E2E безкоординат», оставленная оборвавшимся прогоном.
      #
      # Шаг УРОНИТ прогон, если уборка не отработала: мусор на стенде копится
      # молча и однажды начнёт ронять сами сценарии.
      - name: Убрать остатки прогона
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: |
          if ! node scripts/cleanup-e2e-items.mjs --apply; then
            echo "::error::уборка не отработала — объявления могли остаться на стенде. Добить: node scripts/cleanup-e2e-items.mjs --apply"
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────
  # Прод после мержа: развернулся ли и открывается ли. Только чтение.
  #
  # Полный прогон ушёл на стенд, но стенд не видит прод-развёртывания:
  # сломанная сборка Vercel или пропавшая переменная окружения в проде
  # прошли бы мимо. Пять проверок лендинга (tests/landing.spec.ts) не
  # входят в учётку и ничего не пишут. Учёток заданию не дают вовсе, так
  # что сценарий с записью здесь не запустится даже по ошибке.
  prod-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Браузер
        run: npx playwright install --with-deps chromium

      # Прод разворачивается асинхронно: без ожидания проверка смотрела бы
      # ПРЕДЫДУЩУЮ сборку.
      - name: Дождаться прод-развёртывания этого коммита
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=${{ github.sha }}&environment=Production" --jq '.[0].id // empty')
            if [ -n "$id" ]; then
              state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state // empty')
              echo "развёртывание $id: ${state:-нет статуса}"
              [ "$state" = "success" ] && exit 0
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::прод не развернулся — проверять нечего"
                exit 1
              fi
            else
              echo "развёртывания для коммита пока нет"
            fi
            sleep 15
          done
          echo "::error::прод не развернулся за 10 минут"
          exit 1

      - name: Лендинг прода
        env:
          E2E_READ_ONLY: '1'
        # --trace=off и --reporter=line: см. про публичный репозиторий выше.
        run: npx playwright test tests/landing.spec.ts --trace=off --reporter=line
