<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Цвет системной полосы — чернила продукта #121417. Стоявший здесь
         #080808 снят вместе со всей палитрой 12.08; на телефоне он давал
         полосу чуть темнее шапки сайта, в двух пикселях от неё. -->
    <meta name="theme-color" content="#121417" />
    <title>RentIt — Location d'outils entre voisins en Brabant Wallon</title>
    <meta name="description" content="Louez des outils professionnels à vos voisins en Brabant Wallon. Perceuses, kärcher, tondeuses — moins cher qu'acheter, disponible en minutes." />

    <!-- ── Превью ссылки ──────────────────────────────────────────────
         Адрес сайта здесь НЕ НАПИСАН, а подставляется из
         supabase/functions/_shared/operator.ts (плагин в vite.config.ts).
         До 21.09 тут стоял литерал домена, который занят посторонним
         лицом; разбор — в шапке vite.config.ts.

         og:url обязателен: без него относительный og:image некуда
         разрешать, и соцсеть не показывает картинку вовсе. -->
    <meta property="og:site_name" content="RentIt" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="RentIt — Location d'outils en Brabant Wallon" />
    <!-- Здесь жило «Protection incluse» — обещание страховки, которой нет.
         Заменивший его текст говорил только чем сервис НЕ является: превью
         ссылки — первое, что читает человек, которому её прислали, и оно
         должно называть предложение, а не одни оговорки. Границы стоят на
         самой странице, крупно. Заодно возвращён Brabant Wallon: это
         единственное слово, по которому превью вообще опознаётся местным. -->
    <meta property="og:description" content="Louez des outils entre voisins en Brabant Wallon. Sans commission, règlement en espèces entre vous." />
    <!-- РАСТР, НЕ SVG. Facebook, LinkedIn, WhatsApp, Telegram и Signal
         векторную картинку в превью не рендерят ни один: ссылка
         показывалась пустым прямоугольником, хотя файл отдавался с кодом
         200. Рисуется скриптом scripts/build-brand-assets.mjs. -->
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RentIt — L'outil du voisin, quand il vous faut." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_BE" />
    <meta property="og:locale:alternate" content="nl_BE" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Twitter читает свои теги и на og:image не откатывается, когда
         указан twitter:card: без этих строк карточка выходит пустой. -->
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:title" content="RentIt — Location d'outils en Brabant Wallon" />
    <meta name="twitter:description" content="Louez des outils entre voisins en Brabant Wallon. Sans commission, règlement en espèces entre vous." />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="canonical" href="%SITE_URL%/" />
    <link rel="alternate" hreflang="fr" href="%SITE_URL%/?lang=fr" />
    <link rel="alternate" hreflang="nl" href="%SITE_URL%/?lang=nl" />
    <link rel="alternate" hreflang="en" href="%SITE_URL%/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="%SITE_URL%/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RentIt",
      "url": "%SITE_URL%",
      "description": "Location d'outils P2P entre voisins en Belgique",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "%SITE_URL%/browse?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <!-- Здесь висели <link> и <script> на unpkg.com с leaflet. Грузились
         они на КАЖДОЙ странице — на входе, на лендинге, в условиях, где
         карты нет. Пакет leaflet и так лежит в зависимостях; теперь он
         импортируется в src/pages/Home.tsx и приезжает только с витриной.
         Сторонних доменов у продукта после этого не осталось. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
