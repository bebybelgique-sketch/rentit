<!DOCTYPE html>
<html>
<head><title>RentIt Icon Generator</title></head>
<body style="font-family:monospace;padding:20px;background:#080808;color:#F2F0EB">
<h2 style="color:#ADFF2F">Icon Generator</h2>
<button onclick="gen(192,'icon-192.png')" style="margin:8px;padding:10px 20px;background:#ADFF2F;border:none;cursor:pointer;font-weight:700">Download icon-192.png</button>
<button onclick="gen(512,'icon-512.png')" style="margin:8px;padding:10px 20px;background:#ADFF2F;border:none;cursor:pointer;font-weight:700">Download icon-512.png</button>
<canvas id="c" style="display:none"></canvas>
<script>
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#080808"/>
  <text x="256" y="340" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="300" fill="#F2F0EB" letter-spacing="-10">R</text>
  <circle cx="390" cy="160" r="40" fill="#ADFF2F"/>
</svg>`;
function gen(size, filename) {
  const canvas = document.getElementById('c');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const blob = new Blob([svg], {type:'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, size, size);
    const a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL('image/png');
    a.click();
    URL.revokeObjectURL(url);
  };
  img.src = url;
}
</script>
</body>
</html>
